---
title: Discord — davexmachina
layout: default
header:
  small: true
  text: "Join the davexmachina community server."
---

<style>
  .page-header-small { min-height: 0 !important; height: auto !important; }
  .page-header-image { display: none !important; }
  .discord-card {
    background-color: #172b4d;
    border: 1px solid rgba(45,206,137,.35) !important;
    box-shadow: 0 0 25px rgba(45,206,137,.12) !important;
  }
</style>

<div class="row justify-content-center py-5">
  <div class="col-lg-5 col-md-8">
    <div class="card discord-card border-0 shadow text-white text-center">
      <div class="card-body p-5">
        <img id="serverIcon" src="../assets/img/brand/exmachina-icon.png" alt="ExMachina server icon"
             width="80" height="80" class="rounded-circle mx-auto mb-3 d-block"
             style="border: 2px solid rgba(45,206,137,.5);">
        <h3 class="text-white mb-1" id="serverName">ExMachina</h3>
        <p class="text-white-50 mb-4">
          <span id="numOnline" class="text-success font-weight-bold">—</span> ·
          <span id="numTotal">community server</span>
        </p>
        <a href="https://discord.gg/GXMfVeYuYC" target="_blank" rel="noopener"
           class="btn btn-success btn-lg">
          <i class="ni ni-send mr-2"></i>Join the Server
        </a>
      </div>
    </div>
  </div>
</div>



<script>
  /* Optional: live counts via modern API, vanilla JS, non-blocking.
     If it fails, the static card above just stays as-is. */
  (function () {
    var CODE = "GXMfVeYuYC";
    fetch("https://discord.com/api/v10/invites/" + CODE + "?with_counts=true")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        if (d.approximate_presence_count != null)
          document.getElementById("numOnline").textContent = d.approximate_presence_count.toLocaleString("en") + " online";
        if (d.approximate_member_count != null)
          document.getElementById("numTotal").textContent = d.approximate_member_count.toLocaleString("en") + " members";
        if (d.guild && d.guild.name)
          document.getElementById("serverName").textContent = d.guild.name;
        if (d.guild && d.guild.id && d.guild.icon)
          document.getElementById("serverIcon").src = "https://cdn.discordapp.com/icons/" + d.guild.id + "/" + d.guild.icon + ".png";
      })
      .catch(function () { /* keep static fallback */ });
  })();
</script>
